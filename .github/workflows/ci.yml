name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Cached responses only: no network, no keys. Fails on a >2 point accuracy drop vs eval/baseline.json.
      - run: npm run eval
      - run: npm run eval:check
